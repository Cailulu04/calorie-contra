# Deploy on Render: https://render.com → New → Blueprint → connect this repo
services:
  - type: web
    name: calorie-contra
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: hypercorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: gemini_api_key
        sync: false
      - key: USDA_API_KEY
        sync: false
